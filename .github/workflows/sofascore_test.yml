name: Test Sofascore access
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Liga Pro results endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url = 'https://www.sofascore.com/api/v1/unique-tournament/15006/season/88262/events/last/0'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1',
              'Accept': 'application/json',
              'Referer': 'https://www.sofascore.com/'
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
                  events = data.get('events', [])
                  print('HTTP:', response.status)
                  print('Matches on page:', len(events))
                  print('Has next page:', data.get('hasNextPage'))
                  if events:
                      e = events[0]
                      print('Sample match ID:', e.get('id'))
                      print('Sample start timestamp:', e.get('startTimestamp'))
                      print('Home score fields:', sorted(e.get('homeScore', {}).keys()))
                      print('Away score fields:', sorted(e.get('awayScore', {}).keys()))
          except urllib.error.HTTPError as e:
              print('HTTP error:', e.code)
              print('Response preview:', e.read(300).decode('utf-8', errors='replace'))
          except Exception as e:
              print('Request error:', type(e).__name__, str(e))
          PY
