name: Test OddsHub historical date selection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Inspect historical date controls
        run: |
          mkdir -p output
          cat > /tmp/inspect_dates.py <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright
          OUT=Path('output')
          URL='https://www.oddshub.io/table-tennis/russia-liga-pro/results'
          async def capture(page, label):
              await page.screenshot(path=str(OUT/f'{label}.png'), full_page=False)
              controls=await page.locator('button, input, [role="dialog"], [role="gridcell"]').evaluate_all('els => els.map(e=>({tag:e.tagName,role:e.getAttribute("role"),text:(e.innerText||"").slice(0,90),aria:e.getAttribute("aria-label"),placeholder:e.getAttribute("placeholder"),type:e.getAttribute("type")})).filter(x=>x.text||x.aria||x.placeholder).slice(-250)')
              (OUT/f'{label}_controls.json').write_text(json.dumps(controls,ensure_ascii=False,indent=2))
              print(label,'URL:',page.url,'controls:',len(controls),flush=True)
              for x in controls:
                  if re.search('date|month|year|2026|2025|apply|range|calendar|jan|feb|nov|previous|next|custom',str(x),re.I):print('CONTROL',str(x)[:250],flush=True)
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page(viewport={'width':1440,'height':900},timezone_id='Europe/Moscow')
                  response=await page.goto(URL,wait_until='domcontentloaded',timeout=60000)
                  print('HTTP:',response.status if response else None,flush=True)
                  await page.wait_for_timeout(2200)
                  await capture(page,'initial')
                  try:
                      cal=page.locator('button[aria-haspopup="dialog"]').first
                      print('Calendar buttons:',await page.locator('button[aria-haspopup="dialog"]').count(),flush=True)
                      await cal.click(timeout=8000)
                      await page.wait_for_timeout(900)
                      await capture(page,'calendar_open')
                      dialog=page.locator('[role="dialog"]')
                      print('DIALOG TEXT:',(await dialog.first.inner_text())[:3500] if await dialog.count() else 'no dialog',flush=True)
                  except Exception as e: print('CALENDAR ERROR:',repr(e),flush=True)
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/inspect_dates.py
      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshub-year-calendar-test
          path: output/
          if-no-files-found: warn
          retention-days: 7
