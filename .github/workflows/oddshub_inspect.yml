name: Inspect OddsHub results data
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect OddsHub page
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import urllib.request, re, json, html, pathlib
          url = 'https://www.oddshub.io/table-tennis/russia-liga-pro/results'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'})
          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read(5_000_000)
              print('HTTP:', response.status, 'Bytes:', len(raw), 'Final URL:', response.url)
          page = raw.decode('utf-8', errors='replace')
          pathlib.Path('output/oddshub_page.html').write_text(page, encoding='utf-8')
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', page, flags=re.I|re.S)
          print('Script blocks:', len(scripts))
          print('Next.js payload present:', '__NEXT_DATA__' in page or 'self.__next_f.push' in page)
          print('Date strings (examples):', list(dict.fromkeys(re.findall(r'(?:2026-11-0[1-8]|0?[1-8][./-]11[./-]2026|Nov(?:ember)?\s+[1-8])', page, re.I)))[:20])
          print('Score-like patterns:', len(re.findall(r'(?<!\d)(?:[0-2]?\d)\s*[-:]\s*(?:[0-2]?\d)(?!\d)', page)))
          for idx, (attrs, body) in enumerate(scripts):
              if 'application/ld+json' in attrs.lower():
                  pathlib.Path(f'output/jsonld_{idx}.txt').write_text(body[:100000], encoding='utf-8')
          clean = re.sub(r'<script\b.*?</script\s*>|<style\b.*?</style\s*>', ' ', page, flags=re.I|re.S)
          clean = html.unescape(re.sub(r'<[^>]+>', ' ', clean))
          clean = re.sub(r'\s+', ' ', clean)
          pathlib.Path('output/visible_text.txt').write_text(clean[:300000], encoding='utf-8')
          print('Visible text sample:', clean[:1500])
          print('Saved raw page and extracted text as artifact.')
          PY
      - name: Upload inspection files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshub-inspection
          path: output/
          retention-days: 3
