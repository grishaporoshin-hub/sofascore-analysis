name: OddsHub corrected historical export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install requirements
        run: |
          pip install -q playwright beautifulsoup4
          python -m playwright install chromium
      - name: Export and validate October and November
        run: |
          mkdir -p output
          cat > /tmp/run.py <<'PY'
          import asyncio,csv,json,re
          from collections import Counter
          from datetime import date,datetime
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          OUT=Path('output'); BASE='https://www.oddshub.io/table-tennis/russia-liga-pro/results'
          periods=[('2026-10-01','2026-10-28'),('2026-10-29','2026-10-31'),('2026-11-01','2026-11-08')]
          rows=[];reports=[]
          def parse(html,begin,end):
              soup=BeautifulSoup(html,'html.parser'); found=[];outside=0
              for section in soup.select('section'):
                  h=section.find(['h2','h3','h4'])
                  if not h:continue
                  m=re.search(r'\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{1,2})\b',h.get_text(' ',strip=True),re.I)
                  if not m:continue
                  month=datetime.strptime(m[1][:3].title(),'%b').month
                  d=date(2026,month,int(m[2])).isoformat()
                  for el in section.select('a[href*="/closing-odds"],button[aria-label*="Closing odds"]'):
                      if not begin<=d<=end:
                          outside+=1;continue
                      card=el.find_parent('div',class_=lambda c:c and 'group' in c.split())
                      if not card:continue
                      tm=card.find('span',string=re.compile(r'^\d{1,2}:\d{2}$'))
                      if not tm:continue
                      t=tm.get_text(strip=True)
                      scores=[]
                      for sp in el.select('span.mt-0\\.5 span'):
                          x=re.fullmatch(r'(\d+)\s*-\s*(\d+)',sp.get_text(' ',strip=True))
                          if x:scores.append((int(x[1]),int(x[2])))
                      if len(scores)<3:continue
                      first=scores[:3]
                      found.append({'date_msk':d,'time_msk':t,'match':el.get('aria-label',''),
                                    'match_url':el.get('href',''),
                                    'set1':f'{first[0][0]}:{first[0][1]}',
                                    'set2':f'{first[1][0]}:{first[1][1]}',
                                    'set3':f'{first[2][0]}:{first[2][1]}',
                                    'category':'odd_present' if any((a+b)%2 for a,b in first) else 'all_even'})
              return found,outside
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(timezone_id='Europe/Moscow',viewport={'width':1440,'height':900})
                  for begin,end in periods:
                      report={'requested_from':begin,'requested_to':end,'clicks':0}
                      try:
                          resp=await page.goto(f'{BASE}?from={begin}&to={end}',wait_until='domcontentloaded',timeout=55000)
                          await page.wait_for_timeout(1600)
                          report['http']=resp.status if resp else None
                          previous=-1
                          for _ in range(35):
                              html=await page.content(); parsed,_=parse(html,begin,end)
                              btn=page.get_by_role('button',name=re.compile('Show 100 more',re.I))
                              if not await btn.count() or not await btn.first.is_visible():break
                              if len(parsed)<=previous:break
                              previous=len(parsed)
                              await btn.first.click(timeout=10000)
                              report['clicks']+=1
                              await page.wait_for_timeout(900)
                          html=await page.content()
                          parsed,outside=parse(html,begin,end)
                          report['parsed_in_range']=len(parsed)
                          report['cards_outside_requested_range']=outside
                          report['dates_seen']=dict(sorted(Counter(x['date_msk'] for x in parsed).items()))
                          report['still_has_more_button']=bool(await page.get_by_role('button',name=re.compile('Show 100 more',re.I)).count())
                          report['no_matches_message']='No matches finished in this period' in await page.locator('body').inner_text()
                          (OUT/f'page_{begin}_{end}.html').write_text(html,encoding='utf-8')
                          rows.extend(parsed)
                      except Exception as e:report['error']=str(e)[:350]
                      reports.append(report);print(json.dumps(report),flush=True)
                  await browser.close()
              dedup={ (r['date_msk'],r['time_msk'],r['match_url'] or r['match'],r['set1'],r['set2'],r['set3']):r for r in rows }
              allrows=sorted(dedup.values(),key=lambda r:(r['date_msk'],r['time_msk']))
              selected=[r for r in allrows if '07:00'<=r['time_msk']<='11:00']
              fields=['date_msk','time_msk','match','match_url','set1','set2','set3','category']
              for name,data in [('all_parsed.csv',allrows),('matches_07_11.csv',selected)]:
                  with (OUT/name).open('w',newline='',encoding='utf-8-sig') as f:
                      w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(data)
              summary={'WARNING':'Partial archive. Absence of rows does not mean no matches. Check dates_seen, still_has_more_button, and cards_outside_requested_range.',
                       'periods':reports,'selected_matches':len(selected),'odd_present':sum(r['category']=='odd_present' for r in selected),
                       'all_even':sum(r['category']=='all_even' for r in selected)}
              (OUT/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
              print('SUMMARY',json.dumps({k:v for k,v in summary.items() if k!='periods'},ensure_ascii=False))
          asyncio.run(main())
          PY
          python /tmp/run.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshub-corrected-results
          path: output/
          retention-days: 7
          if-no-files-found: warn
