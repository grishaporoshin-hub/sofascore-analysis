name: Liga Pro full final scores
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install requirements
        run: |
          python -m pip install --quiet playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Collect match final scores
        run: |
          mkdir -p output
          cat > /tmp/collect.py <<'PY'
          import asyncio, csv, json, re, calendar
          from datetime import date
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          
          BASE = "https://www.oddshub.io/table-tennis/russia-liga-pro/results"
          OUT = Path("output")
          OUT.mkdir(exist_ok=True)
          TODAY = date.today()
          END = min(date(2026, 11, 30), TODAY)
          START = date(2026, 10, 1)
          records, diagnostics = [], []
          
          def parse(html, start, end):
              soup = BeautifulSoup(html, "html.parser")
              result = []
              for section in soup.select("section"):
                  heading = section.find(["h2", "h3", "h4"])
                  if not heading:
                      continue
                  m = re.search(r"\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{1,2})\b",
                                heading.get_text(" ", strip=True), re.I)
                  if not m:
                      continue
                  month = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].index(m[1][:3].lower())+1
                  day = int(m[2])
                  try:
                      d = date(2026, month, day)
                  except ValueError:
                      continue
                  if not start <= d <= end:
                      continue
                  for btn in section.select('button[aria-label*="Closing odds"]'):
                      card = btn.parent
                      if not card:
                          continue
                      time_node = card.select_one("span")
                      tm = time_node.get_text(" ", strip=True) if time_node else ""
                      if not re.fullmatch(r"\d{1,2}:\d{2}", tm):
                          continue
                      # Match original page structure: scores are in span.mt-0.5 span.
                      score_nodes = btn.select("span.mt-0\\.5 span")
                      if not score_nodes:
                          score_nodes = [x for x in btn.find_all("span")
                                         if re.fullmatch(r"\d+\s*[-:]\s*\d+", x.get_text(" ",strip=True))]
                      scores=[]
                      for node in score_nodes:
                          s = re.fullmatch(r"(\d+)\s*[-:]\s*(\d+)",node.get_text(" ",strip=True))
                          if s:
                              pair=(int(s[1]),int(s[2]))
                              if not scores or scores[-1]!=pair or node is score_nodes[0]:
                                  scores.append(pair)
                      # Only accept complete best-of-five matches with exactly three set wins.
                      wins_a = wins_b = 0
                      for a,b in scores:
                          if a==b:
                              break
                          wins_a += a>b
                          wins_b += b>a
                          if wins_a==3 or wins_b==3:
                              break
                      else:
                          continue
                      played = wins_a+wins_b
                      if played not in (3,4,5):
                          continue
                      if len(scores)!=played:
                          continue
                      result.append(dict(date_msk=d.isoformat(),time_msk=tm,
                                         match=btn.get("aria-label",""),
                                         final_score=f"{wins_a}:{wins_b}",
                                         source_url=f"{BASE}?from={start}&to={end}"))
              return result
          
          async def main():
              if END<START:
                  raise RuntimeError("Period has not started yet")
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page(viewport={"width":1440,"height":900},timezone_id="Europe/Moscow")
                  for month in (10,11):
                      last=min(calendar.monthrange(2026,month)[1], END.day if month==11 else 31)
                      for first in range(1,last+1,7):
                          final=min(first+6,last)
                          begin=date(2026,month,first); finish=date(2026,month,final)
                          url=f"{BASE}?from={begin}&to={finish}"
                          report={"from":str(begin),"to":str(finish),"url":url,"clicks":0,"truncated":False}
                          try:
                              response=await page.goto(url,wait_until="domcontentloaded",timeout=60000)
                              report["http"]=response.status if response else None
                              await page.wait_for_timeout(2000)
                              for i in range(100):
                                  more=page.get_by_role("button",name=re.compile("Show 100 more",re.I))
                                  if not await more.count() or not await more.first.is_visible():
                                      break
                                  await more.first.click(timeout=15000)
                                  report["clicks"]+=1
                                  await page.wait_for_timeout(850)
                              more=page.get_by_role("button",name=re.compile("Show 100 more",re.I))
                              report["truncated"]=bool(await more.count() and await more.first.is_visible())
                              html=await page.content()
                              (OUT/f"page_{begin}_{finish}.html").write_text(html,encoding="utf-8")
                              parsed=parse(html,begin,finish)
                              report["verified_matches"]=len(parsed)
                              report["empty_page"]= "No matches finished in this period" in await page.locator("body").inner_text()
                              records.extend(parsed)
                          except Exception as exc:
                              report["error"]=str(exc)[:350]
                          diagnostics.append(report)
                          print(json.dumps(report,ensure_ascii=False),flush=True)
                  await browser.close()
              unique={(r["date_msk"],r["time_msk"],r["match"]):r for r in records}
              rows=sorted(unique.values(),key=lambda r:(r["date_msk"],r["time_msk"],r["match"]))
              with (OUT/"liga_pro_final_scores.csv").open("w",newline="",encoding="utf-8-sig") as f:
                  writer=csv.DictWriter(f,fieldnames=["date_msk","time_msk","match","final_score","source_url"])
                  writer.writeheader();writer.writerows(rows)
              summary={"period_start":str(START),"period_end":str(END),
                       "verified_match_count":len(rows),"period_reports":diagnostics,
                       "warning":"Only confirmed final scores are exported. Missing/failed periods mean archive is NOT complete."}
              (OUT/"coverage_report.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
              print("VERIFIED",len(rows),flush=True)
          
          asyncio.run(main())
          PY
          python /tmp/collect.py
      - name: Upload CSV and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liga-pro-final-scores
          path: output/
          retention-days: 14
          if-no-files-found: warn
