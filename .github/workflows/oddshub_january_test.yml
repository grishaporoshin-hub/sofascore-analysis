name: Test OddsHub January 2026 archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check January selection
        run: |
          mkdir -p output
          cat > /tmp/check.py <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          URL = 'https://www.oddshub.io/table-tennis/russia-liga-pro/results'
          async def main():
              report = {}
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(viewport={'width': 1440, 'height': 1000}, timezone_id='Europe/Moscow')
                  try:
                      response = await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                      report['initial_http'] = response.status if response else None
                      await page.wait_for_timeout(2500)
                      await page.get_by_role('button', name='Custom range').click(timeout=12000)
                      await page.wait_for_timeout(500)
                      for i in range(10):
                          await page.get_by_role('button', name='Go to the Previous Month').click(timeout=8000)
                          await page.wait_for_timeout(100)
                      report['calendar_text'] = (await page.get_by_role('dialog').inner_text())[:1000]
                      await page.screenshot(path='output/january_calendar.png')
                      report['jan_1_enabled'] = await page.get_by_role('button', name=re.compile(r'January 1st, 2026')).is_enabled()
                      report['jan_30_enabled'] = await page.get_by_role('button', name=re.compile(r'January 30th, 2026')).is_enabled()
                      if report['jan_1_enabled'] and report['jan_30_enabled']:
                          await page.get_by_role('button', name=re.compile(r'January 1st, 2026')).click()
                          await page.get_by_role('button', name=re.compile(r'January 30th, 2026')).click()
                          await page.get_by_role('button', name='Apply').click()
                          await page.wait_for_timeout(4000)
                          report['url_after_apply'] = page.url
                          report['visible_text_sample'] = (await page.locator('body').inner_text())[-5000:]
                          report['january_visible'] = 'Jan ' in report['visible_text_sample'] or 'January' in report['visible_text_sample']
                          await page.screenshot(path='output/january_results.png', full_page=False)
                          with open('output/january_page.html', 'w') as f:
                              f.write(await page.content())
                  except Exception as e:
                      report['error'] = repr(e)
                      await page.screenshot(path='output/error.png')
                  finally:
                      with open('output/report.json', 'w') as f:
                          json.dump(report, f, ensure_ascii=False, indent=2)
                      print(json.dumps({k:v for k,v in report.items() if k!='visible_text_sample'}, ensure_ascii=False, indent=2))
                      await browser.close()
          asyncio.run(main())
          PY
          python /tmp/check.py
      - name: Upload inspection files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshub-january-test
          path: output/
          if-no-files-found: warn
