name: Test alternative table tennis sources
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check AISports and OddsHub access
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re
          sites = {
            'AISports Liga Pro': 'https://aisports.ru/league/table_tennis/russia-liga-pro',
            'OddsHub Liga Pro': 'https://www.oddshub.io/table-tennis/russia-liga-pro/results',
          }
          for name, url in sites.items():
              print(f'\n=== {name} ===', flush=True)
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; DataAvailabilityCheck/1.0)'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read(300000)
                      page = raw.decode('utf-8', errors='replace')
                      print('HTTP:', response.status)
                      print('Bytes sampled:', len(raw))
                      print('Contains set-like scores:', bool(re.search(r'\b(?:[0-9]{1,2})\s*[-:]\s*(?:[0-9]{1,2})\b', page)))
                      print('Contains November 2026:', bool(re.search(r'(?:Nov(?:ember)?\s*[1-8]|[0-8][1-9]\.11\.2026)', page, re.I)))
                      print('Page title:', (re.search(r'<title[^>]*>(.*?)</title>', page, re.I | re.S) or [None, 'not found'])[1][:160])
              except urllib.error.HTTPError as e:
                  print('HTTP error:', e.code)
              except Exception as e:
                  print('Error:', type(e).__name__, str(e)[:200])
          PY
