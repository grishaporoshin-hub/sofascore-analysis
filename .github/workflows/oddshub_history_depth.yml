name: Check OddsHub 2026 history depth
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check five historical months
        run: |
          mkdir -p output
          cat > /tmp/history.py <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          BASE = 'https://www.oddshub.io/table-tennis/russia-liga-pro/results'
          RANGES = [('february','2026-02-01','2026-02-28'),
                    ('april','2026-04-01','2026-04-30'),
                    ('june','2026-06-01','2026-06-30'),
                    ('august','2026-08-01','2026-08-30'),
                    ('october','2026-10-01','2026-10-30')]

          async def main():
              results = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(viewport={'width': 1440, 'height': 900}, timezone_id='Europe/Moscow')
                  for name, start, end in RANGES:
                      row = {'month': name, 'from': start, 'to': end}
                      try:
                          response = await page.goto(f'{BASE}?from={start}&to={end}', wait_until='domcontentloaded', timeout=45000)
                          await page.wait_for_timeout(2500)
                          body = await page.locator('body').inner_text()
                          row.update(http=response.status if response else None,
                                     final_url=page.url,
                                     no_matches='No matches finished in this period' in body,
                                     show_more='Show 100 more' in body,
                                     date_mentions=len(re.findall(r'\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\b', body)),
                                     score_patterns=len(re.findall(r'\b(?:1[01]|[0-9])\s*[-:]\s*(?:1[01]|[0-9])\b', body)),
                                     tail=body[-1400:])
                          await page.screenshot(path=f'output/{name}.png', full_page=False)
                      except Exception as e:
                          row['error'] = repr(e)
                      results.append(row)
                      print(json.dumps({k:v for k,v in row.items() if k!='tail'}, ensure_ascii=False), flush=True)
                  await browser.close()
              with open('output/report.json', 'w', encoding='utf-8') as f:
                  json.dump(results, f, ensure_ascii=False, indent=2)
          asyncio.run(main())
          PY
          python /tmp/history.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshub-history-depth
          path: output/
          if-no-files-found: warn
